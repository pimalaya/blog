name: publish

# Every push to master rebuilds the static site (pages + feed.xml + sitemap)
# and deploys it to GitHub Pages, served at blog.pimalaya.org (custom domain
# configured in the repository Pages settings, DNS CNAME to
# pimalaya.github.io). The newsletter has no CI step: new posts are mailed by
# hand via `npm run newsletter -- <slug>` (see the README).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
